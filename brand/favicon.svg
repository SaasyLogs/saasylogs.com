<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Saasy Logs">
  <title>Saasy Logs</title>
  <!--
    FAVICON ONLY — not the logo. Use logo.svg at 64px and above.

    The interlocked SL and the sunglasses compete for the same pixels, so at
    16-32px the full mark turns to mush: the letters stop reading and you get
    an indistinct blob. The sunglasses are the distinctive half of the
    identity, so the favicon keeps those alone, scaled up to fill the tile.
    Recognisable in a tab strip at 16px, still on-brand next to logo.svg.

    Soot shades on a Marigold tile, not the logo's Marigold-on-Ember-keyline:
    a 4% keyline is sub-pixel at 32px and turns to mush, so the small mark
    takes its contrast from the tile instead. 8.65:1, and the brand colour is
    the thing you actually see in a tab strip. Trello #15 - different problem
    at this size, so a different answer.
  -->
  <rect width="512" height="512" rx="88" fill="#f59e0b"/>

  <!-- Inset and optically centred so the lenses clear the rounded corners -->
  <g transform="translate(256 246) scale(0.84) translate(-256 -256)">
  <g fill="#17120f">
    <!-- brow bar -->
    <rect x="28" y="176" width="456" height="42" rx="21"/>
    <!-- bridge -->
    <path d="M 206 214 C 230 190 282 190 306 214 L 306 250 C 282 232 230 232 206 250 Z"/>
    <!-- left lens -->
    <path d="M 40 210 H 212 L 194 316 C 184 362 150 390 110 390 C 72 390 42 364 34 320 L 40 220 Z"/>
    <!-- right lens -->
    <path d="M 472 210 H 300 L 318 316 C 328 362 362 390 402 390 C 440 390 470 364 478 320 L 472 220 Z"/>
  </g>

  <!-- Highlight kept large enough to survive downscaling -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M 72 250 L 116 316"/>
  </g>
  </g>
</svg>
