  </g>
  </g>
<g transform="translate(173.0 232.0) scale(0.31798) translate(-256 -256)">
  <g fill="#17120f">
    <rect x="28" y="176" width="456" height="42" rx="21"/>
    <path d="M 206 214 C 230 190 282 190 306 214 L 306 250 C 282 232 230 232 206 250 Z"/>
    <path d="M 40 210 H 212 L 194 316 C 184 362 150 390 110 390 C 72 390 42 364 34 320 L 40 220 Z"/>
